<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Git練習ページ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Git練習ページ</h1>
    <p>第29章 課題29-1：Git と GitHub を使ったプロジェクト管理</p>
  </header>
  <main>
    <section>
      <h2>このページについて</h2>
      <p>Git で変更を記録し、GitHub で共有する流れを練習するためのページです。</p>
    </section>
    <section>
      <h2>第29章で学んだこと</h2>
      <ul>
        <li>Git は変更を記録して、いつでも戻れる保険になる</li>
        <li>main は直接触らず、ブランチで作業してから合流させる</li>
        <li>プルリクエストで変更の中身を説明して、確認してから取り込む</li>
        <li>.gitignore で、公開してはいけない物を先に決めておく</li>
      </ul>
    </section>
  </main>
  <footer>
    <p>最終更新：<span id="today"></span></p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
